<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反馈管理 · 绿分类助手管理后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo"><span class="logo-mark">绿</span> 绿分类助手</div>
      <nav>
        <a href="index.html"><span class="nav-icon">📊</span> 控制台</a>
        <a href="goods.html"><span class="nav-icon">📦</span> 物品管理</a>
        <a href="feedback.html" class="active"><span class="nav-icon">💬</span> 反馈管理</a>
        <a href="stats.html"><span class="nav-icon">📈</span> 数据统计</a>
      </nav>
      <div class="logout" onclick="logout()">退出登录</div>
    </aside>

    <main class="main">
      <div class="page-title">用户反馈管理</div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:60px;">序号</th>
                <th>反馈内容</th>
                <th>联系方式</th>
                <th style="width:100px;">状态</th>
                <th style="width:180px;">提交时间</th>
                <th style="width:160px;">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"><tr><td colspan="6" class="empty-tip">加载中...</td></tr></tbody>
          </table>
        </div>

        <div class="pagination">
          <span class="page-info" id="pageInfo">共 0 条</span>
          <button class="btn btn-outline btn-sm" onclick="prevPage()">上一页</button>
          <span class="page-info" id="pageNow">第 1 页</span>
          <button class="btn btn-outline btn-sm" onclick="nextPage()">下一页</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (!checkAuth()) return

    let page = 1
    let pageSize = 10
    let total = 0

    // 加载反馈列表
    async function loadList() {
      const r = await callFunction('adminGetFeedbackList', { page, pageSize })
      if (handleCode(r)) return
      if (r.code !== 0) { showError(r.msg); return }

      total = r.data.total
      const list = r.data.list
      document.getElementById('pageInfo').textContent = '共 ' + total + ' 条'
      document.getElementById('pageNow').textContent = '第 ' + page + ' 页'

      const tbody = document.getElementById('tbody')
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-tip">暂无用户反馈</td></tr>'
        return
      }

      tbody.innerHTML = list.map((f, i) => {
        const done = f.status === 1
        return `
        <tr>
          <td>${(page - 1) * pageSize + i + 1}</td>
          <td style="max-width:380px;">${escapeHtml(f.content)}</td>
          <td>${escapeHtml(f.contact || '匿名')}</td>
          <td><span class="tag ${done ? 'tag-done' : 'tag-pending'}">${done ? '已处理' : '待处理'}</span></td>
          <td>${formatTime(f.createTime)}</td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="toggleStatus('${f._id}', ${done ? 0 : 1})">${done ? '标记未处理' : '标记已处理'}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteFeedback('${f._id}')">删除</button>
          </td>
        </tr>`
      }).join('')
    }

    function showError(msg) {
      document.getElementById('tbody').innerHTML = '<tr><td colspan="6" class="empty-tip">' + (msg || '加载失败') + '</td></tr>'
    }

    // 标记已处理 / 未处理
    async function toggleStatus(id, status) {
      const r = await callFunction('adminUpdateFeedbackStatus', { id, status })
      if (handleCode(r)) return
      if (r.code === 0) { loadList() } else { alert(r.msg || '操作失败') }
    }

    // 删除反馈
    async function deleteFeedback(id) {
      if (!confirm('确定删除该条反馈吗？')) return
      const r = await callFunction('adminDeleteFeedback', { id })
      if (handleCode(r)) return
      if (r.code === 0) { loadList() } else { alert(r.msg || '删除失败') }
    }

    // 分页
    function prevPage() { if (page > 1) { page--; loadList() } }
    function nextPage() { if (page * pageSize < total) { page++; loadList() } }

    // 时间格式化
    function formatTime(ts) {
      if (!ts) return '-'
      const d = new Date(ts)
      const p = n => String(n).padStart(2, '0')
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`
    }

    // HTML 转义
    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    }

    loadList()
  </script>
</body>
</html>
