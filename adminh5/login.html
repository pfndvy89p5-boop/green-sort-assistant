<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 · 绿分类助手</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">绿</div>
    <div class="login-title">绿分类助手 · 管理后台</div>
    <div class="login-sub">垃圾回收管理系统管理员入口</div>

    <form id="loginForm">
      <div class="form-group">
        <label>账号</label>
        <input class="input" id="username" placeholder="请输入管理员账号" value="admin" autocomplete="off">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="input" id="password" type="password" placeholder="请输入密码">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;margin-top:4px;">登 录</button>
    </form>
    <p id="msg" style="margin-top:14px;text-align:center;color:#DC2626;font-size:13px;display:none;"></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // 已登录则直接进入控制台
    if (localStorage.getItem('admin_token')) {
      location.href = 'index.html'
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault()
      const username = document.getElementById('username').value.trim()
      const password = document.getElementById('password').value.trim()
      const msgEl = document.getElementById('msg')

      if (!username || !password) {
        msgEl.style.display = 'block'
        msgEl.textContent = '请输入账号和密码'
        return
      }

      try {
        // 调用 adminLogin 云函数
        const r = await callFunction('adminLogin', { username, password })
        if (r.code === 0) {
          // 登录成功,保存 token(24小时有效)
          localStorage.setItem('admin_token', r.data.token)
          localStorage.setItem('admin_username', username)
          location.href = 'index.html'
        } else {
          msgEl.style.display = 'block'
          msgEl.textContent = r.msg || '登录失败'
        }
      } catch (err) {
        msgEl.style.display = 'block'
        msgEl.textContent = '网络错误,请检查 API 配置或网络'
      }
    })
  </script>
</body>
</html>
